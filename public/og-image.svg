<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- White neumorphic background -->
    <filter id="neu-card" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="8" dy="8" stdDeviation="20" flood-color="#d0d0d0" flood-opacity="0.6"/>
      <feDropShadow dx="-8" dy="-8" stdDeviation="20" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>

    <!-- Soft inner glow for the basket container -->
    <filter id="neu-inner" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="5" dy="5" stdDeviation="12" flood-color="#d0d0d0" flood-opacity="0.5"/>
      <feDropShadow dx="-5" dy="-5" stdDeviation="12" flood-color="#ffffff" flood-opacity="0.85"/>
    </filter>

    <!-- Veil gradient: white fully opaque at bottom, fading to transparent at top -->
    <radialGradient id="veil" cx="50%" cy="75%" r="55%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.92"/>
    </radialGradient>

    <!-- Basket bottom veil: strong white fade from bottom -->
    <linearGradient id="basket-veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.88"/>
    </linearGradient>

    <!-- Subtle brand-orange ambient glow behind basket -->
    <radialGradient id="orange-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#F4510B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F4510B" stop-opacity="0"/>
    </radialGradient>

    <!-- Floating animation -->
    <style>
      .basket-group { animation: float 3.8s ease-in-out infinite; transform-origin: 870px 295px; }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50%       { transform: translateY(-14px); }
      }
    </style>
  </defs>

  <!-- ── Background ─────────────────────────────────────────────── -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Neumorphic main card with rounded corners -->
  <rect x="40" y="40" width="1120" height="550" rx="48" ry="48"
        fill="#f8f8f8" filter="url(#neu-card)"/>

  <!-- Subtle top-left brand accent stripe -->
  <rect x="40" y="40" width="8" height="550" rx="4" ry="4" fill="#F4510B" opacity="0.7"/>

  <!-- ── Left column: logo + tagline + pill ─────────────────────── -->

  <!-- Logo — centred in left half -->
  <image href="/aQross logo-no bg.png"
         x="100" y="160" width="380" height="120"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- Divider line below logo -->
  <line x1="100" y1="308" x2="480" y2="308" stroke="#F4510B" stroke-width="2" opacity="0.25"/>

  <!-- Tagline -->
  <text x="100" y="345" font-family="Poppins, system-ui, sans-serif"
        font-size="22" font-weight="600" fill="#444444" letter-spacing="0.3">
    Shop &amp; Delivery for Students
  </text>
  <text x="100" y="375" font-family="Poppins, system-ui, sans-serif"
        font-size="17" font-weight="400" fill="#888888" letter-spacing="0.2">
    Groceries · Stationery · Pharma — Campus Fast
  </text>

  <!-- Brand pill button -->
  <rect x="100" y="410" width="210" height="48" rx="24" ry="24" fill="#F4510B"/>
  <text x="205" y="440" font-family="Poppins, system-ui, sans-serif"
        font-size="16" font-weight="700" fill="#ffffff"
        text-anchor="middle" dominant-baseline="middle">
    aqcoss.co.ke
  </text>

  <!-- Neumorphic stat pills row -->
  <!-- Pill 1 -->
  <rect x="100" y="480" width="100" height="38" rx="12" ry="12"
        fill="#f0f0f0" filter="url(#neu-inner)"/>
  <text x="150" y="499" font-family="Poppins, system-ui, sans-serif"
        font-size="11" font-weight="700" fill="#F4510B"
        text-anchor="middle">15–45 min</text>
  <text x="150" y="512" font-family="Poppins, system-ui, sans-serif"
        font-size="9" font-weight="500" fill="#999"
        text-anchor="middle">Delivery</text>

  <!-- Pill 2 -->
  <rect x="212" y="480" width="100" height="38" rx="12" ry="12"
        fill="#f0f0f0" filter="url(#neu-inner)"/>
  <text x="262" y="499" font-family="Poppins, system-ui, sans-serif"
        font-size="11" font-weight="700" fill="#F4510B"
        text-anchor="middle">Student</text>
  <text x="262" y="512" font-family="Poppins, system-ui, sans-serif"
        font-size="9" font-weight="500" fill="#999"
        text-anchor="middle">Deals</text>

  <!-- Pill 3 -->
  <rect x="324" y="480" width="100" height="38" rx="12" ry="12"
        fill="#f0f0f0" filter="url(#neu-inner)"/>
  <text x="374" y="499" font-family="Poppins, system-ui, sans-serif"
        font-size="11" font-weight="700" fill="#F4510B"
        text-anchor="middle">Verified</text>
  <text x="374" y="512" font-family="Poppins, system-ui, sans-serif"
        font-size="9" font-weight="500" fill="#999"
        text-anchor="middle">Shops</text>

  <!-- ── Right column: floating basket ──────────────────────────── -->

  <!-- Orange ambient glow -->
  <ellipse cx="870" cy="310" rx="230" ry="200" fill="url(#orange-glow)"/>

  <!-- Neumorphic basket container circle -->
  <circle cx="870" cy="295" r="195" fill="#f5f5f5" filter="url(#neu-inner)" opacity="0.85"/>

  <!-- Basket image (floating group) -->
  <g class="basket-group">
    <image href="/3ce0b937-e727-4591-b5fa-8a8eac6f3d1b.png"
           x="660" y="115" width="420" height="360"
           preserveAspectRatio="xMidYMid meet"/>

    <!-- Veil gradient overlay — floats with the basket -->
    <rect x="660" y="115" width="420" height="360" fill="url(#basket-veil)"/>
  </g>

  <!-- Radial veil overlaying the whole right panel — blends basket into white -->
  <rect x="580" y="40" width="580" height="550" rx="0" ry="0" fill="url(#veil)"/>

  <!-- ── Divider ─────────────────────────────────────────────────── -->
  <line x1="580" y1="100" x2="580" y2="530"
        stroke="#e8e8e8" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- ── Bottom domain strip ────────────────────────────────────── -->
  <text x="600" y="590" font-family="Poppins, system-ui, sans-serif"
        font-size="14" font-weight="500" fill="#bbbbbb" text-anchor="middle">
    aqcoss.co.ke · Shop &amp; Delivery for Campus Students
  </text>
</svg>
