<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <!-- QuickMart: red background, white bold wordmark -->
  <rect width="200" height="80" rx="10" fill="#E31837"/>
  <!-- Q mark icon -->
  <circle cx="28" cy="36" r="14" fill="none" stroke="white" stroke-width="4"/>
  <line x1="38" y1="46" x2="46" y2="56" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <!-- Wordmark -->
  <text x="108" y="30" font-family="Arial Black, Arial, sans-serif"
        font-size="17" font-weight="900" fill="white" text-anchor="middle" letter-spacing="0.5">QUICK</text>
  <text x="108" y="52" font-family="Arial Black, Arial, sans-serif"
        font-size="17" font-weight="900" fill="white" text-anchor="middle" letter-spacing="0.5">MART</text>
  <text x="108" y="68" font-family="Arial, sans-serif"
        font-size="9" font-weight="400" fill="rgba(255,255,255,0.75)" text-anchor="middle" letter-spacing="2">SUPERMARKET</text>
</svg>
